const PATCH=`
const MAP_SPRITES={};function loadMapSprites(){for(const [k,src] of Object.entries(parent.IMG||IMG)){const im=new Image();im.onload=()=>renderAll();im.src=src;MAP_SPRITES[k]=im}}
function roadMaskAt(x,y){const r=game.world.tiles,c=(nx,ny)=>!!r[ny]?.[nx]?.road;return(c(x,y-1)?1:0)|(c(x+1,y)?2:0)|(c(x,y+1)?4:0)|(c(x-1,y)?8:0)}
function ds(ctx,img,x,y,s,rot=0){if(!img||!img.complete||!img.naturalWidth)return false;ctx.save();ctx.translate(x+s/2,y+s/2);ctx.rotate(rot*Math.PI/180);ctx.drawImage(img,-s/2,-s/2,s,s);ctx.restore();return true}
function dg(ctx,x,y,s){if(!ds(ctx,MAP_SPRITES.grass,x,y,s)){ctx.fillStyle='#344b36';ctx.fillRect(x,y,s,s)}}
function dr(ctx,x,y,s,m){if(m===15&&ds(ctx,MAP_SPRITES.cross,x,y,s))return;if((m===11)&&ds(ctx,MAP_SPRITES.t,x,y,s))return;if(m===7&&ds(ctx,MAP_SPRITES.t,x,y,s,90))return;if(m===14&&ds(ctx,MAP_SPRITES.t,x,y,s,180))return;if(m===13&&ds(ctx,MAP_SPRITES.t,x,y,s,270))return;if((m===5||m===1||m===4)&&ds(ctx,MAP_SPRITES.v,x,y,s))return;if((m===10||m===2||m===8)&&ds(ctx,MAP_SPRITES.h,x,y,s))return;if(m===9&&ds(ctx,MAP_SPRITES.corner,x,y,s))return;if(m===3&&ds(ctx,MAP_SPRITES.corner,x,y,s,90))return;if(m===6&&ds(ctx,MAP_SPRITES.corner,x,y,s,180))return;if(m===12&&ds(ctx,MAP_SPRITES.corner,x,y,s,270))return;dg(ctx,x,y,s)}
function renderMap(){const c=$('#worldCanvas');if(!c)return;const x=c.getContext('2d'),W=c.width,H=c.height,N=game.world.size,z=W/N,p=worldPalette();x.clearRect(0,0,W,H);for(const row of game.world.tiles)for(const t of row)dg(x,t.x*z,t.y*z,z+.5);for(const row of game.world.tiles)for(const t of row)if(t.road)dr(x,t.x*z,t.y*z,z+.5,roadMaskAt(t.x,t.y));for(const row of game.world.tiles)for(const t of row){const cx=(t.x+.5)*z,cy=(t.y+.5)*z;if(t.type===TILE.ROCK)drawRock(x,cx,cy+2,.9)}for(const row of game.world.tiles)for(const t of row){if(t.type===TILE.EMPTY||t.type===TILE.ROCK||t.cleared)continue;drawPoi(x,t.type,(t.x+.5)*z,(t.y+.5)*z,t.type===TILE.BOSS?24:20)}const px=(game.pos.x+.5)*z,py=(game.pos.y+.5)*z;x.save();x.translate(px,py);x.shadowColor='rgba(244,201,113,.65)';x.shadowBlur=20;x.fillStyle='#d7b36a';x.strokeStyle='#201b13';x.lineWidth=3;x.beginPath();x.arc(0,0,16,0,Math.PI*2);x.fill();x.stroke();x.shadowColor='transparent';x.fillStyle='#262d27';x.beginPath();x.moveTo(-9,10);x.lineTo(0,-14);x.lineTo(9,10);x.closePath();x.fill();x.fillStyle='#f0d7a2';x.beginPath();x.arc(0,-6,4,0,Math.PI*2);x.fill();x.restore();const r=game.visionRadius();for(const row of game.world.tiles)for(const t of row){const n=Math.max(Math.abs(t.x-game.pos.x),Math.abs(t.y-game.pos.y))<=r,v=t.revealed&&(!game.isNight()||n);if(!v){x.fillStyle=p.fog;x.fillRect(t.x*z,t.y*z,z+.5,z+.5)}}}
`;
