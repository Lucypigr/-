<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>GRIMPATH v0.20.1</title>
  <style>
    html,body{margin:0;background:#090c0a;color:#ddd;font-family:system-ui}
    #loading{height:100vh;display:grid;place-items:center;text-align:center;letter-spacing:.08em}
    small{display:block;color:#999;margin-top:8px}
  </style>
</head>
<body>
<div id="loading">GRIMPATH v0.20.1<small>載入隨機路網、怪物插畫與專屬戰鬥特效…</small></div>
<script>
(async()=>{
  try{
    const [gameRes,roadRes,monsterRes]=await Promise.all([
      fetch('./index_v0.17_full_embedded.html?build=0201',{cache:'no-store'}),
      fetch('./hotfix018.js?build=0201',{cache:'no-store'}),
      fetch('./hotfix0201.js?build=0201',{cache:'no-store'})
    ]);
    if(!gameRes.ok)throw new Error('game HTTP '+gameRes.status);
    if(!roadRes.ok)throw new Error('road patch HTTP '+roadRes.status);
    if(!monsterRes.ok)throw new Error('monster patch HTTP '+monsterRes.status);
    let html=await gameRes.text();
    const roadPatch=await roadRes.text();
    const monsterPatch=await monsterRes.text();
    const stamp="setTimeout(()=>{document.title='GRIMPATH v0.20.1';const s=document.querySelector('.brand small');if(s)s.textContent='荒暮森林 · 怪物專屬特效 v0.20.1';},120);";
    html=html.replace(/<title>.*?<\/title>/i,'<title>GRIMPATH v0.20.1</title>');
    const openTag='<scr'+'ipt>';
    const closeTag='</scr'+'ipt>';
    const safePatch=(roadPatch+'\n'+monsterPatch+'\n'+stamp).replace(/<\/script/gi,'<\\/script');
    html=html.replace('</body>',openTag+safePatch+closeTag+'</body>');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('loading').innerHTML='載入失敗<small>'+String(e)+'</small>';
    console.error(e);
  }
})();
</script>
</body>
</html>
