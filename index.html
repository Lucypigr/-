<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRIMPATH</title></head><body style="background:#0b0f0d;color:#ddd;font-family:system-ui;display:grid;place-items:center;height:100vh;margin:0"><div>GRIMPATH 載入中…</div><script>const parts=['github_parts/part1.txt','github_parts/part2.txt','github_parts/part3.txt','github_parts/part4.txt'];Promise.all(parts.map(p=>fetch(p).then(r=>{if(!r.ok)throw new Error(p);return r.text()}))).then(xs=>{document.open();document.write(xs.join(''));document.close()}).catch(e=>{document.body.innerHTML='<pre style="padding:20px">載入失敗：'+e+'</pre>'});</script></body></html>
