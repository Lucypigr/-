name: Apply GRIMPATH v0.14

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v014.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply chest UI upgrade
        run: python3 scripts/apply_v014.py
      - name: Commit updated game
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade GRIMPATH chest reward UI to v0.14 [skip ci]"
          git push
