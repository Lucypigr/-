name: Apply GRIMPATH v0.16 Tilemap
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v16.py'
      - '.github/workflows/apply-v16.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tilemap migration
        run: python3 scripts/apply_v16.py
      - name: Commit generated map tiles and index
        run: |
          git config user.name "GRIMPATH Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html assets/maptiles
          git commit -m "Apply v0.16 generated tilemap renderer" || exit 0
          git push